<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — MONTRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0b0b0a;
    --offwhite:#f4f2ec;
    --warmwhite:#faf9f6;
    --deepgrey:#3a3937;
    --beige:#e6dfd0;
    --brass:#a9865a;
    --line: rgba(11,11,10,0.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--warmwhite);color:var(--black);font-family:'Inter',sans-serif;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  header{
    position:sticky;top:0;z-index:100;
    background:rgba(250,249,246,0.92);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1360px;margin:0 auto;padding:0 40px;height:72px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{font-family:'Fraunces',serif;font-size:24px;letter-spacing:0.08em;font-weight:500;}
  .header-links{display:flex;align-items:center;gap:26px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;font-weight:500;}
  .cart-link{position:relative;display:flex;align-items:center;}
  .cart-link svg{width:19px;height:19px;stroke:var(--black);fill:none;stroke-width:1.4;}
  .cart-count{
    position:absolute;top:-7px;right:-9px;background:var(--black);color:var(--offwhite);
    font-size:9px;width:15px;height:15px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }

  main{max-width:1360px;margin:0 auto;padding:40px 40px 80px;min-height:70vh;}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:600;}
  h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(30px,4vw,46px);margin:10px 0 6px;letter-spacing:-0.01em;}
  .count{font-size:14px;color:#888;margin-bottom:34px;}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 24px;}
  .card{position:relative;}
  .thumb{position:relative;overflow:hidden;background:var(--beige);aspect-ratio:3/4;display:block;}
  .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease;}
  .card:hover .thumb img{transform:scale(1.05);}
  .tag{position:absolute;top:12px;left:12px;background:#777;color:var(--offwhite);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;z-index:2;}
  .remove{
    position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;border-radius:50%;
    background:var(--black);display:flex;align-items:center;justify-content:center;
  }
  .remove svg{width:15px;height:15px;stroke:var(--offwhite);fill:var(--offwhite);stroke-width:1.4;}
  .info{padding-top:14px;}
  .info h3{font-size:14.5px;font-weight:500;margin-bottom:6px;}
  .info h3 a:hover{text-decoration:underline;}
  .price{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;}
  .price .old{color:#999;text-decoration:line-through;font-weight:400;font-size:13px;}
  .opt-btn{
    margin-top:12px;width:100%;border:1px solid var(--black);padding:12px;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;font-weight:600;transition:.3s;display:block;text-align:center;
  }
  .opt-btn:hover{background:var(--black);color:var(--offwhite);}

  .state{padding:90px 20px;text-align:center;color:#888;grid-column:1/-1;}
  .state a{border-bottom:1px solid var(--black);color:var(--black);font-weight:600;}

  .toast{
    position:fixed;bottom:28px;left:50%;transform:translate(-50%,160%);
    background:var(--black);color:var(--offwhite);padding:14px 26px;font-size:13px;
    z-index:2000;transition:transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s ease, visibility .45s;
    opacity:0;visibility:hidden;
  }
  .toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;}

  @media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:860px){
    .header-inner{padding:0 16px;height:64px;}
    main{padding:24px 16px 60px;}
    .grid{grid-template-columns:repeat(2,1fr);gap:24px 14px;}
    .remove{width:42px;height:42px;}   /* bigger tap target */
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="montra.html" class="logo">MONTRA</a>
    <div class="header-links">
      <a href="shop.html">Shop</a>
      <a href="montra.html#cart" class="cart-link" aria-label="Cart">
        <svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L4 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </div>
</header>

<main>
  <span class="eyebrow">MONTRA</span>
  <h1>My Wishlist</h1>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"><div class="state">Loading...</div></div>
</main>

<div class="toast" id="toast"></div>

<script>
  const API = 'http://localhost:3001';

  function esc(text) {
    return String(text ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }
  const formatPrice = n => '£' + n.toLocaleString();
  const getToken = () => localStorage.getItem('montra_token');
  const headers = () => ({ 'Content-Type': 'application/json', Authorization: 'Bearer ' + getToken() });

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  let items = [];   // the saved products

  async function loadWishlist() {
    const grid = document.getElementById('grid');

    // Not logged in? Ask them to log in
    if (!getToken()) {
      document.getElementById('count').textContent = '';
      grid.innerHTML = '<div class="state">Please <a href="montra.html#login">log in</a> to see your wishlist.</div>';
      return;
    }

    try {
      const res = await fetch(API + '/api/wishlist', { headers: headers() });

      // Expired login
      if (res.status === 401) {
        localStorage.removeItem('montra_token');
        grid.innerHTML = '<div class="state">Your session expired. Please <a href="montra.html#login">log in</a> again.</div>';
        return;
      }
      if (!res.ok) throw new Error();

      items = await res.json();
      render();
    } catch (err) {
      grid.innerHTML = '<div class="state">Could not load your wishlist. Is the server running?</div>';
    }
  }

  function render() {
    const grid = document.getElementById('grid');
    document.getElementById('count').textContent = items.length + (items.length === 1 ? ' saved item' : ' saved items');

    if (items.length === 0) {
      grid.innerHTML = '<div class="state">Your wishlist is empty.<br><br><a href="shop.html">Start shopping</a></div>';
      return;
    }

    grid.innerHTML = items.map(({ product: p }) => `
      <div class="card" id="card-${p.id}">
        <a class="thumb" href="product.html?id=${p.id}">
          ${p.stock <= 0 ? '<span class="tag">Sold out</span>' : ''}
          <img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">
        </a>
        <button class="remove" type="button" onclick="removeItem(${p.id})" aria-label="Remove from wishlist">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-5-9.7-9.4C.6 8.2 2.2 5 5.4 5c1.8 0 3.3 1 4.1 2.3C10.3 6 11.8 5 13.6 5c3.2 0 4.8 3.2 3.1 6.6C19.5 16 12 21 12 21z"/></svg>
        </button>
        <div class="info">
          <h3><a href="product.html?id=${p.id}">${esc(p.name)}</a></h3>
          <div class="price">
            <span>${formatPrice(p.price)}</span>
            ${p.oldPrice ? `<span class="old">${formatPrice(p.oldPrice)}</span>` : ''}
          </div>
          <a class="opt-btn" href="product.html?id=${p.id}">Choose options</a>
        </div>
      </div>`).join('');
  }

  async function removeItem(productId) {
    try {
      const res = await fetch(API + '/api/wishlist/' + productId, { method: 'DELETE', headers: headers() });
      if (!res.ok) throw new Error();
      items = items.filter(i => i.product.id !== productId);
      render();
      showToast('Removed from wishlist');
    } catch (err) {
      showToast('Could not remove it. Please try again.');
    }
  }

  async function updateCartBadge() {
    const badge = document.getElementById('cartCount');
    if (!getToken()) { badge.textContent = 0; return; }
    try {
      const res = await fetch(API + '/api/cart', { headers: { Authorization: 'Bearer ' + getToken() } });
      badge.textContent = res.ok ? (await res.json()).length : 0;
    } catch (err) {
      badge.textContent = 0;
    }
  }

  loadWishlist();
  updateCartBadge();
</script>
</body>
</html>
